<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pong — 10 Levels</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="900" height="600"></canvas>
    <div id="ui">
      <div id="score">
        <span id="player-score">0</span> — <span id="ai-score">0</span>
      </div>
      <div id="level">Level: 1 / 10</div>
      <div id="messages">Press Space to Start</div>
      <div id="controls">
        Controls: W / S or Up / Down — Space to (re)start — P to Pause
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
