<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pong — 10 Levels</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap" tabindex="0">
    <canvas id="game" width="900" height="600" aria-label="Pong game"></canvas>

    <div id="ui">
      <div id="score">
        <span id="player-score">0</span> — <span id="ai-score">0</span>
      </div>
      <div id="level">Level: 1 / 10</div>
      <div id="messages">Press Space or Start to begin</div>
      <div id="controls">Controls: W / S or Up / Down — Space to (re)start — P to Pause</div>
    </div>

    <div id="startOverlay" class="overlay">
      <div class="panel">
        <h1>Pong — 10 Levels</h1>
        <p>Red = player (left), Blue = AI (right). Use W/S or Up/Down, or touch the buttons on mobile.</p>
        <div class="buttons">
          <button id="startBtn" class="primary">Start</button>
          <button id="muteBtn" class="secondary">Mute Sounds</button>
        </div>
      </div>
    </div>

    <div id="touchControls" class="touch-controls" aria-hidden="true">
      <button id="touchUp" class="tc">▲</button>
      <button id="touchDown" class="tc">▼</button>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
